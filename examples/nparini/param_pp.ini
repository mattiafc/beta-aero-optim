! =====================================================================================================
! SELECT POST-PROCESSING
! ======================
! Possible postprocessing functions:
! 1: spectra
! 2: budgets
! 3: vorticity
! 4: correlation
! 5: PDF
! 6: modal energy
! 7: FSTT
! 8: extend restart,stats,plane
!
! 1/ you need to provide regular input files: param.ini, param_block.ini, [param_lines.ini,] info.ini
! 2/ set number of procs per direction in param_block.ini
! 3/ for planes post-processing: informations for plane definition
!                                ~> in param_block.ini (nb, index, vars, ...)
!                                ~> in param.ini (freq_planes, is_timestamp, ...)
! =====================================================================================================
! Select the type of postprocessing: type_pp
2
! Select the type of data: type_data=[1: lines; 2: planes; 3: volumes; 4: stats; 5: restart]
4
! Number of blocks read: nbloc_r
9
! Block number(s)
1 2 3 4 5 6 7 8 9
! plane/line number: nplr
1
! Directory where data are stored: dirDATA
'./'
! Directory where results are stored: dirRESU
'delt/'
! Name to append to output files
'_F'
! =====================================================================================================
! PARAMETERS for SPECTRA
! ======================
! number of samples: set by nmax in param.ini
!
! list of possible directions: t, x,y,z [i,j,k in curvilinear]
! list of possible variables: prs,uu,vv,ww,rho,Tmp,Frhov,Grhow (,udf)
!
! windowing:
! 1/ type_win='T': Tukey window; param_win in [0.,1.] (0.:constant window ~~> 1.:Hann window)
!    for  Hann window, set type_win='T' & param_win=1.
!    for rect. window, set type_win='T' & param_win=0.
! 2/ type_win='K': Kaiser-Bessel window; param_win=alpha (narrow for large alpha) 
!    recommanded value for alpha: 3. (3.*pi)
!    require AMOS library for Bessel functions
!
! =====================================================================================================
! dimension: dim_spec=[1: 1D-spectra; 2: 2D-spectra; 3: 3D-spectra]
1
! directions for which PSD is applied: dir_spec(1:dim_spectra) 
't'
! number of directions for averaging spectra: ndir_averag 
1
! directions for averaging spectra: dir_averag(1:ndir_averag) 
'z'
! number variables: nvar_spec
1
! variables: name_var_spec(1:nvar_spec) [see list of possible variables]
uu
! size of blocks: lbloc(1:dim_spec) [set 0 if the full length is taken]
2400
! overlapping blocks in time (Welch method): is_overlap
T
! define overlapping length: loverlap
1200
! windowing type: type_win(1:dim_spec)
T
! parameter for windowing: param_win(1:dim_spec)
1.
! is_onesided: T: one-sided spectra / F: two-sided spectra
F
! use of Capon spectral estimator: is_capon(1:dim_spec) (T: Capon / F: Fourier)
F
! Capon filter length (Capon order): ncapon(1:dim_spec) 1000
1000
! modal analysis: is_modal
F
! number of slices: n1_sl,n2_sl,n3_sl [only for 2D or 3D spectra]
0 0 0
! slice indices for direction 1
0
! slice indices for direction 2
0
! slice indices for direction 3
0
! initial time for samples: time_ini [useful if is_timestamp in param.ini]
0.1203534547619910E-02
